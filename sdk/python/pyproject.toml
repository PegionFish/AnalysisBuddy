[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analysisbuddy-sdk"
version = "0.1.0"
description = "AnalysisBuddy plugin SDK (protocol v1) — zero third-party dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
keywords = ["analysisbuddy", "plugin", "json-rpc", "ndjson"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# CI 断言项（sdk-plugins.md §1.1）：零第三方依赖，纯 stdlib。
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["analysisbuddy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
