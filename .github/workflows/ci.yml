name: ci

on:
  push:
    branches: [main]
    tags: ['contract-*', 'v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# qa-perf.md §5 流水线命名约定（预留，本文件不得占用）：
#   perf-smoke / perf-nightly / e2e-suite 为后续专门流水线的名称与 job 命名空间。
# 矩阵约束（qa-perf.md §5 / PLAN.md §7）：x64 全量（build+test）；ARM64 仅构建+冒烟；
#   Linux（M4.1）仅 headless 服务器链路（build+test，ab-app 不进 Linux job）。

jobs:
  build-x64:
    name: build x64 (build + test + ui build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install ui dependencies
        run: npm ci
        working-directory: ui

      # 顺序约束：ui 构建必须先于 cargo build —— tauri-build 的 build.rs 在
      # 编译期读取 frontendDist (ui/dist) 生成 context（P0-03 实测结论）。
      - name: Build ui (vite)
        run: npm run build
        working-directory: ui

      # 前端 PR 门禁（契约 C3.2）：单测 + i18n 键一致性在 ui 构建后立即校验。
      - name: Test ui (vitest)
        run: npm test -- --run
        working-directory: ui

      - name: Check ui i18n keys
        run: npm run check:i18n
        working-directory: ui

      - name: Build release (x86_64-pc-windows-msvc)
        run: cargo build --release --target x86_64-pc-windows-msvc

      # P3-04 后 e2e_real_plugins 已激活（plugin.json 在仓内）：workspace 的
      # cargo test --release 会跑 ab-e2e 真实插件套件，必须先构建 builtin-csv
      # （独立 crate，不在 workspace members）并安装 analysisbuddy-sdk（demo-tool 依赖）。
      - name: Setup Python (demo-tool 运行时)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysisbuddy-sdk (editable)
        run: python -m pip install -e sdk/python

      - name: Build builtin-csv (release, 独立 crate)
        run: cargo build --release --manifest-path plugins/builtin-csv/Cargo.toml

      - name: Test (release)
        run: cargo test --release

      - name: Upload artifact (AnalysisBuddy-x86_64-dev)
        uses: actions/upload-artifact@v4
        with:
          name: AnalysisBuddy-x86_64-dev
          path: |
            target/x86_64-pc-windows-msvc/release/ab-app.exe
            ui/dist

  build-aarch64:
    name: build aarch64 (3-tier fallback chain)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (aarch64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install ui dependencies
        run: npm ci
        working-directory: ui

      - name: Build ui (vite)
        run: npm run build
        working-directory: ui

      # 三档降级链（PLAN.md §8 风险 1，逐级失败自动降档，降档事实写入 job summary）：
      #   1) native：ARM64 原生 runner。本 job 的 runs-on 暂用 windows-latest
      #      （可稳定触达 cross/check 档）；账号开通 ARM64 runner 后将 runs-on 改为
      #      windows-11-arm 即自动命中本档（脚本按 PROCESSOR_ARCHITECTURE 探测）。
      #   2) cross：x64 runner + MSVC amd64_arm64 交叉链接（脚本经 VsDevCmd.bat
      #      导入环境后执行 cargo build --release --target aarch64-pc-windows-msvc）。
      #   3) check-fallback：cargo check --target aarch64-pc-windows-msvc 通过即视为
      #      构建达标，summary 标注「ARM64 转人工冒烟」（P3-06 承接）。
      - name: ARM64 fallback chain (scripts/ci-arm64.ps1)
        id: arm64
        shell: pwsh
        run: ./scripts/ci-arm64.ps1

      # ARM64 冒烟（P3-06）：scripts/arm64-smoke.ps1 自判档位——
      #   native 档（windows-11-arm 原生 runner）：自动跑 5 用例（宿主启动/便携插件发现/
      #   导入→parse→query/key_values/无孤儿进程），全绿退出码 0；
      #   cross / check-fallback 档：产物不可在本 runner 执行，脚本输出
      #   ARM64_SMOKE_RESULT=manual（退出码 0），本 step 在 job summary 标注
      #   「转人工冒烟 (P3-06)」——由 ARM64 实机按 docs/arm64-smoke-checklist.md 签核留痕。
      - name: ARM64 smoke (scripts/arm64-smoke.ps1)
        id: arm64-smoke
        shell: pwsh
        run: |
          $output = & ./scripts/arm64-smoke.ps1 -Fixture tests/fixtures/small_with_header.csv
          $output
          $mode = (($output | Where-Object { $_ -like 'ARM64_SMOKE_MODE=*' } | Select-Object -First 1) -replace 'ARM64_SMOKE_MODE=', '').Trim()
          $result = (($output | Where-Object { $_ -like 'ARM64_SMOKE_RESULT=*' } | Select-Object -First 1) -replace 'ARM64_SMOKE_RESULT=', '').Trim()
          $summaryLines = @("## ARM64 smoke: mode=$mode result=$result")
          if ($result -eq 'manual') {
            $summaryLines += "cross/check tier: manual smoke required on ARM64 hardware (P3-06). Use docs/arm64-smoke-checklist.md."
          } else {
            $summaryLines += ($output | Where-Object { $_ -like 'ARM64_SMOKE_CASE_*' })
          }
          ($summaryLines -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact (AnalysisBuddy-aarch64-dev, 仅 native/cross 档产出 exe)
        if: steps.arm64.outputs.arm64_has_exe == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AnalysisBuddy-aarch64-dev
          path: |
            target/aarch64-pc-windows-msvc/release/ab-app.exe
            ui/dist

  # Linux 服务器形态（M4.1）：无 GUI 交付链路（ab-server 及其依赖）的持续编译+测试
  # 实证。按 crate 列举而非 workspace 全量——ab-app 依赖 tauri，Linux 构建需要
  # webkit2gtk 等系统库，服务器形态不引入（桌面全量仍由 build-x64 覆盖）；tests/perf
  # 与 e2e_fps_probe 属性能档（qa-perf.md §5 命名空间），亦不在本 job。
  build-linux:
    name: build linux (headless server chain + e2e mock/real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      # demo-tool（e2e_real_plugins 套件 2/3）以 python 拉起并 import analysisbuddy
      # SDK（plugin.json entry.command = "python"），与 build-x64 同款安装方式。
      - name: Setup Python (demo-tool 运行时)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysisbuddy-sdk (editable)
        run: python -m pip install -e sdk/python

      # builtin-csv 是独立 crate（自封 workspace 根，不在根 workspace members）。
      # 必须 --release：plugin.json entry 硬编码 target/release/ 路径，与测试 profile 无关。
      - name: Build builtin-csv (release, 独立 crate)
        run: cargo build --release --manifest-path plugins/builtin-csv/Cargo.toml

      # 预构建 mock-plugin（dev，与下方测试同 profile）：ab-host/e2e 测试在二进制
      # 缺失时会兜底自建，预构建让编译失败定位在独立步骤，并避免测试间重复触发
      # cargo build。
      - name: Build mock-plugin (dev)
        run: cargo build -p mock-plugin

      # Linux 下 cargo 产物无 .exe 后缀，但两处二进制定位硬编码 .exe：
      # tests/e2e/tests/e2e_mock_suite.rs 的 mock_plugin_bin()（直接查
      # target/<profile>/mock-plugin.exe，未像 ab-host 测试那样做扩展名感知）与
      # plugins/builtin-csv/plugin.json entry（target/release/builtin-csv.exe）。
      # 复制出带后缀别名对齐定位路径；两处改为扩展名感知后本步骤可移除。
      - name: Alias Linux binaries with .exe suffix (对齐 e2e 硬编码定位路径)
        run: |
          cp target/debug/mock-plugin target/debug/mock-plugin.exe
          cp plugins/builtin-csv/target/release/builtin-csv plugins/builtin-csv/target/release/builtin-csv.exe

      # dev profile（不对齐 build-x64 的 --release）：套件为功能断言非性能档，
      # mock-plugin 定位按 cfg!(debug_assertions) 自适应 profile，无 release 假设，
      # 省去 release LTO 全量编译成本；仅 builtin-csv 因 plugin.json 硬编码 release
      # 路径单独 --release（见上）。
      - name: Test (headless server chain, dev profile)
        run: cargo test -p ab-protocol -p ab-host -p ab-pipeline -p ab-engine -p ab-server -p mock-plugin

      # e2e mock/real 两套件（规格 M4.1）；--lib 一并跑 ab_e2e harness 库内单测
      # （纯 std 逻辑，无平台依赖）。e2e_fps_probe（Windows UI 帧率探针）不在其列。
      # builtin-csv / demo-tool 缺失时套件按 SKIP 降级，本 job 已预构建并安装两者。
      - name: Test e2e (mock + real plugin suites)
        run: cargo test -p ab-e2e --lib --test e2e_mock_suite --test e2e_real_plugins

  # 契约基线快照（P1-05）：tag 形如 contract-*（如 contract-v1）推送时触发，
  # 复跑 ab-protocol 测试并构建 mock-plugin，产出契约基线 artifact 供评审留档。
  contract-baseline:
    name: contract baseline (ab-protocol tests + mock-plugin build)
    if: startsWith(github.ref, 'refs/tags/contract-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Test ab-protocol
        run: cargo test -p ab-protocol

      - name: Build mock-plugin (release)
        run: cargo build --release -p mock-plugin

      - name: Upload artifact (contract-baseline-snapshot)
        uses: actions/upload-artifact@v4
        with:
          name: contract-baseline-snapshot
          path: |
            target/release/mock-plugin
            target/release/mock-plugin.exe
          if-no-files-found: warn
