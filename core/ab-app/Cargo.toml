[package]
name = "ab-app"
description = "AnalysisBuddy Tauri 2 壳 + IPC 胶水（集成裁判持有）"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
ab-protocol = { path = "../ab-protocol" }
ab-host = { path = "../ab-host" }
ab-pipeline = { path = "../ab-pipeline" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true, features = ["test"] }
tauri-plugin-dialog = "2"
tokio = { workspace = true }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.52"

[dev-dependencies]
# ACL 运行时回归测试（tests/acl_runtime_test.rs）直接驱动
# Resolved::resolve + RuntimeAuthority::resolve_access，需与 tauri
# 锁定的 tauri-utils 同一大版本。
tauri-utils = "2.9"
