[package]
name = "ab-pipeline"
description = "AnalysisBuddy 数据管线：导入→解析调度→内存存储→查询 API"
version.workspace = true
edition.workspace = true

[dependencies]
ab-protocol = { path = "../ab-protocol" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
